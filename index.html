<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>DJI D-RTK 3 座標キャリブレーション計算ツール [Ver.21]</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Segoe UI', Meiryo, sans-serif; background-color: #f4f7f6; color: #333; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 1.3rem; text-align: center; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 15px; margin-bottom: 25px; line-height: 1.4; }
        .form-row { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 250px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; font-size: 0.95rem; }
        select, input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccd1d1; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
        .dms-container { display: flex; gap: 5px; align-items: center; }
        .dms-container input { width: 30%; }
        .dms-label { font-size: 0.9rem; font-weight: bold; color: #7f8c8d; }
        .btn { background: #3498db; color: white; border: none; padding: 14px 20px; font-size: 1.1rem; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; transition: background 0.2s; margin-top: 10px; }
        .btn:hover { background: #2980b9; }
        .btn-map { background: #16a085; margin-top: 20px; }
        .btn-map:hover { background: #1abc9c; }
        .result-box { margin-top: 30px; padding: 20px; background: #e8f6f3; border-left: 5px solid #1abc9c; border-radius: 4px; display: none; }
        .result-item { margin-bottom: 10px; font-size: 1.1rem; }
        .result-value { font-weight: bold; color: #d35400; font-size: 1.3rem; margin-left: 10px; }
        .note { font-size: 0.85rem; color: #7f8c8d; margin-top: 10px; line-height: 1.4; }
        .manual-highlight { background-color: #fff3cd; border: 1px solid #ffeeba; }
        #map { height: 350px; width: 100%; margin-top: 15px; border-radius: 4px; display: none; z-index: 1; border: 1px solid #ccd1d1; }
    </style>
</head>
<body class="notranslate">

<div class="container">
    <h1>DJI D-RTK 3 座標キャリブレーション計算フォーム<br><span style="color: #e74c3c;">[Ver.21] (緯度経度60進数・ジオイド切替対応)</span></h1>

    <div class="form-row">
        <div class="form-group">
            <label>1. 緯度 (北緯)</label>
            <div class="dms-container">
                <input type="number" id="lat-deg" placeholder="度 (例: 34)"> <span class="dms-label">度</span>
                <input type="number" id="lat-min" placeholder="分 (例: 39)"> <span class="dms-label">分</span>
                <input type="number" id="lat-sec" step="0.0001" placeholder="秒 (例: 8.867)"> <span class="dms-label">秒</span>
            </div>
        </div>
        <div class="form-group">
            <label>2. 経度 (東経)</label>
            <div class="dms-container">
                <input type="number" id="lon-deg" placeholder="度 (例: 135)"> <span class="dms-label">度</span>
                <input type="number" id="lon-min" placeholder="分 (例: 31)"> <span class="dms-label">分</span>
                <input type="number" id="lon-sec" step="0.0001" placeholder="秒 (例: 28.4508)"> <span class="dms-label">秒</span>
            </div>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>3. 標高 (m)</label>
            <input type="number" id="input-h" step="0.001" placeholder="例: 150.123">
        </div>
        <div class="form-group">
            <label>4. ジオイド高 (手入力用・m)</label>
            <input type="number" id="input-manual-geoid" class="manual-highlight" step="0.001" placeholder="※入力すると通信を行わず優先計算">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>5. ジオイド種</label>
            <select id="geoid-type">
                <option value="JGD2011">JGD2011 (GSIGEO2011)</option>
                <option value="JGD2024">JGD2024 (GSIGEO2024)</option>
            </select>
        </div>
        <div class="form-group">
            <label>6. アンテナポール高さ</label>
            <select id="pole-height">
                <option value="1.6">1.6 m</option>
                <option value="1.8" selected>1.8 m</option>
                <option value="2.0">2.0 m</option>
            </select>
        </div>
    </div>

    <button type="button" class="btn" onclick="calculate()">7. 変換 ＆ ジオイド高計算実行</button>

    <div class="result-box" id="result-box">
        <div class="result-item">緯度 (10進数): <span class="result-value" id="res-lat">-</span></div>
        <div class="result-item">経度 (10進数): <span class="result-value" id="res-lon">-</span></div>
        <hr style="border: 0; border-top: 1px dashed #bdc3c7; margin: 15px 0;">
        <div class="result-item">ジオイド高: <span class="result-value" id="res-geoid">-</span> m <span id="geoid-source" style="font-size: 0.9rem; color: #7f8c8d; font-weight: normal;"></span></div>
        <div class="result-item">DJI Pilot 2 入力用高さ: <span class="result-value" id="res-height">-</span> m</div>
        <div class="note">
            ※ 緯度経度は WGS84 に準拠します。<br>
            ※ DJI Pilot 2 入力用高さ = ジオイド高 ＋ 標高 ＋ ポール高さ ＋ アンテナ測定位置(0.102m)<br>
            ※ 自社専用のGoogleサーバー(GAS)を経由して国土地理院APIから安定取得します。
        </div>
        
        <button type="button" class="btn btn-map" id="map-toggle-btn" onclick="toggleMap()" style="display: none; width: 100%; text-align: center;">🗺️ 国土地理院地図で位置を確認する</button>
        <div id="map"></div>
    </div>
</div>

<script>
    let map = null;
    let marker = null;
    let isMapVisible = false;

    function updateMap(lat, lon) {
        const zoomLevel = 17; 
        if (!map) {
            map = L.map('map').setView([lat, lon], zoomLevel);
            L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
                attribution: "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank'>国土地理院</a>",
                maxZoom: 18
            }).addTo(map);
            marker = L.marker([lat, lon]).addTo(map);
        } else {
            map.setView([lat, lon], zoomLevel);
            marker.setLatLng([lat, lon]);
        }
    }

    function toggleMap() {
        isMapVisible = !isMapVisible;
        const mapDiv = document.getElementById('map');
        const btn = document.getElementById('map-toggle-btn');
        if (isMapVisible) {
            mapDiv.style.display = 'block';
            btn.innerText = '🗺️ 地図を閉じる';
            if (map) { setTimeout(() => map.invalidateSize(), 100); }
        } else {
            mapDiv.style.display = 'none';
            btn.innerText = '🗺️ 国土地理院地図で位置を確認する';
        }
    }

    async function calculate() {
        let latDeg = document.getElementById("lat-deg").value;
        let latMin = document.getElementById("lat-min").value;
        let latSec = document.getElementById("lat-sec").value;
        let lonDeg = document.getElementById("lon-deg").value;
        let lonMin = document.getElementById("lon-min").value;
        let lonSec = document.getElementById("lon-sec").value;

        const orthometricHeight = parseFloat(document.getElementById("input-h").value);
        const manualGeoidStr = document.getElementById("input-manual-geoid").value;
        const poleHeight = parseFloat(document.getElementById("pole-height").value);
        const geoidType = document.getElementById("geoid-type").value;

        if (latDeg === "" || lonDeg === "" || isNaN(orthometricHeight)) {
            alert("緯度(度)、経度(度)、標高は必ず正しく入力してください。");
            return;
        }

        let lat = parseFloat(latDeg) + (parseFloat(latMin || 0) / 60) + (parseFloat(latSec || 0) / 3600);
        let lon = parseFloat(lonDeg) + (parseFloat(lonMin || 0) / 60) + (parseFloat(lonSec || 0) / 3600);

        try {
            document.getElementById("res-lat").innerText = lat.toFixed(8);
            document.getElementById("res-lon").innerText = lon.toFixed(8);
            document.getElementById("res-geoid").innerText = "計算中...";
            document.getElementById("geoid-source").innerText = "";
            document.getElementById("res-height").innerText = "-";
            document.getElementById("result-box").style.display = "block";
            
            document.getElementById("map-toggle-btn").style.display = "block";
            updateMap(lat, lon);

            if (manualGeoidStr !== "") {
                const manualGeoidHeight = parseFloat(manualGeoidStr);
                document.getElementById("res-geoid").innerText = manualGeoidHeight.toFixed(3);
                document.getElementById("geoid-source").innerText = "(手入力)";
                const finalHeight = manualGeoidHeight + orthometricHeight + poleHeight + 0.102;
                document.getElementById("res-height").innerText = finalHeight.toFixed(3);
                return;
            }

            // 国土地理院APIパラメーター: JGD2011は「2」、JGD2024は「3」を設定
            let datumVal = (geoidType === "JGD2024") ? "3" : "2";

            const gasUrl = `https://script.google.com/macros/s/AKfycbxHsX5kTqdXhlZ9OVYbhkgH4YsAu35amq1gO4aJH0HirygY19y3q2erP8rmqXRiSn2EsA/exec?lat=${lat}&lon=${lon}&datum=${datumVal}`;
            
            try {
                const response = await fetch(gasUrl);
                if (!response.ok) throw new Error("GAS Network Error");
                
                const data = await response.json();
                
                if (data.OutputData && data.OutputData.geoidHeight) {
                    const geoidHeight = parseFloat(data.OutputData.geoidHeight);
                    document.getElementById("res-geoid").innerText = geoidHeight.toFixed(3);
                    document.getElementById("geoid-source").innerText = `(自動取得 - ${geoidType})`;
                    
                    const finalHeight = geoidHeight + orthometricHeight + poleHeight + 0.102;
                    document.getElementById("res-height").innerText = finalHeight.toFixed(3);
                } else if (data.ExportData && data.ExportData.ErrMsg) {
                    throw new Error("国土地理院APIエラー: " + data.ExportData.ErrMsg);
                } else {
                    throw new Error("Invalid Data from GAS");
                }
            } catch (err) {
                console.error(err);
                alert("通信エラー: " + err.message);
                document.getElementById("res-geoid").innerText = "取得エラー";
                document.getElementById("geoid-source").innerText = "手入力してください";
                document.getElementById("res-height").innerText = "計算不可";
            }

        } catch (error) {
            console.error(error);
            alert("座標変換エラーが発生しました。");
        }
    }
</script>

</body>
</html>
