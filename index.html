<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJI D-RTK 3 座標キャリブレーション計算ツール</title>
    <!-- 座標変換ライブラリ Proj4js を読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <style>
        body { font-family: 'Segoe UI', Meiryo, sans-serif; background-color: #f4f7f6; color: #333; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { font-size: 1.4rem; text-align: center; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 15px; margin-bottom: 25px; }
        .form-row { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 250px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; font-size: 0.95rem; }
        select, input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccd1d1; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
        .switch-container { display: flex; align-items: center; justify-content: space-between; background: #eef2f5; padding: 12px; border-radius: 4px; margin-bottom: 20px; }
        .btn { background: #3498db; color: white; border: none; padding: 14px 20px; font-size: 1.1rem; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; transition: background 0.2s; margin-top: 10px; }
        .btn:hover { background: #2980b9; }
        .btn-swap { background: #34495e; padding: 8px 15px; font-size: 0.9rem; width: auto; margin: 0; }
        .btn-swap:hover { background: #2c3e50; }
        .result-box { margin-top: 30px; padding: 20px; background: #e8f6f3; border-left: 5px solid #1abc9c; border-radius: 4px; display: none; }
        .result-item { margin-bottom: 10px; font-size: 1.1rem; }
        .result-value { font-weight: bold; color: #d35400; font-size: 1.3rem; margin-left: 10px; }
        .note { font-size: 0.85rem; color: #7f8c8d; margin-top: 10px; line-height: 1.4; }
        .credit { margin-top: 15px; padding-top: 10px; border-top: 1px solid #bdc3c7; font-size: 0.85rem; color: #2c3e50; font-weight: bold; text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <h1>DJI D-RTK 3 座標キャリブレーション計算フォーム</h1>
    
    <div class="form-group" style="margin-bottom: 20px;">
        <label>1. 平面直角座標系</label>
        <select id="coordinate-system"></select>
    </div>

    <div class="switch-container">
        <div>
            <strong>3. 座標系の種類:</strong> 
            <span id="coord-type-label" style="color: #c0392b; font-weight: bold; margin-left: 10px;">測量座標系 (X=南北, Y=東西)</span>
        </div>
        <button type="button" class="btn btn-swap" onclick="toggleXY()">X/Y を入れ替える</button>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label id="label-x">2. X座標 [南北] (m)</label>
            <input type="number" id="input-x" step="0.001" placeholder="例: -142345.678">
        </div>
        <div class="form-group">
            <label id="label-y">2. Y座標 [東西] (m)</label>
            <input type="number" id="input-y" step="0.001" placeholder="例: -23456.789">
        </div>
    </div>

    <div class="form-group" style="margin-bottom: 20px;">
        <label>4. 標高 (m)</label>
        <input type="number" id="input-h" step="0.001" placeholder="例: 150.123">
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>5. ジオイド種</label>
            <select id="geoid-type">
                <option value="JGD2011">JGD2011 (GSIGEO2011)</option>
                <option value="JGD2024">JGD2024 (GSIGEO2024)</option>
            </select>
        </div>
        <div class="form-group">
            <label>7. アンテナポール高さ</label>
            <select id="pole-height">
                <option value="1.6">1.6 m</option>
                <option value="1.8">1.8 m</option>
                <option value="2.0">2.0 m</option>
            </select>
        </div>
    </div>

    <button type="button" class="btn" onclick="calculate()">6. 変換 ＆ ジオイド高計算実行</button>

    <div class="result-box" id="result-box">
        <div class="result-item">緯度 (10進数): <span class="result-value" id="res-lat">-</span></div>
        <div class="result-item">経度 (10進数): <span class="result-value" id="res-lon">-</span></div>
        <hr style="border: 0; border-top: 1px dashed #bdc3c7; margin: 15px 0;">
        <div class="result-item">取得ジオイド高: <span class="result-value" id="res-geoid">-</span> m</div>
        <div class="result-item">DJI Pilot 2 入力用高さ: <span class="result-value" id="res-height">-</span> m</div>
        <div class="note">
            ※ 緯度経度は WGS84(JGD2011) に準拠します。<br>
            ※ DJI Pilot 2 入力用高さ = ジオイド高 ＋ 標高 ＋ ポール高さ ＋ アンテナ測定位置(0.102m)<br>
            ※ ジオイド高は国土地理院APIよりリアルタイム取得しています。
        </div>
        <div class="credit">
            出典：国土地理院 (ジオイド高計算APIを利用して作成)
        </div>
    </div>
</div>

<script>
    // 1. 平面直角座標系の定義 (1〜19系) とプルダウンの生成
    const systems = [
        { id: 1, lat: 33, lon: 129.5, name: "第1系 (長崎・鹿児島西部など)" },
        { id: 2, lat: 33, lon: 131.0, name: "第2系 (福岡・佐賀・熊本・大分など)" },
        { id: 3, lat: 36, lon: 132.1666666666667, name: "第3系 (山口・島根・広島)" },
        { id: 4, lat: 33, lon: 133.5, name: "第4系 (香川・愛媛・徳島・高知)" },
        { id: 5, lat: 36, lon: 134.3333333333333, name: "第5系 (兵庫・鳥取・岡山)" },
        { id: 6, lat: 36, lon: 136.0, name: "第6系 (京都・大阪・福井・滋賀・三重・奈良・和歌山)" },
        { id: 7, lat: 36, lon: 137.1666666666667, name: "第7系 (石川・富山・岐阜・愛知)" },
        { id: 8, lat: 36, lon: 138.5, name: "第8系 (新潟・長野・山梨・静岡)" },
        { id: 9, lat: 36, lon: 139.8333333333333, name: "第9系 (東京・福島・栃木・茨城・埼玉・千葉・群馬・神奈川)" },
        { id: 10, lat: 40, lon: 140.8333333333333, name: "第10系 (青森・秋田・山形・岩手・宮城)" },
        { id: 11, lat: 44, lon: 140.25, name: "第11系 (北海道西部)" },
        { id: 12, lat: 44, lon: 142.25, name: "第12系 (北海道中央部)" },
        { id: 13, lat: 44, lon: 144.25, name: "第13系 (北海道東部)" },
        { id: 14, lat: 26, lon: 142.0, name: "第14系 (小笠原諸島)" },
        { id: 15, lat: 26, lon: 127.5, name: "第15系 (沖縄本島など)" },
        { id: 16, lat: 26, lon: 124.0, name: "第16系 (先島諸島)" },
        { id: 17, lat: 26, lon: 131.0, name: "第17系 (大東諸島)" },
        { id: 18, lat: 20, lon: 136.0, name: "第18系 (沖ノ鳥島)" },
        { id: 19, lat: 26, lon: 154.0, name: "第19系 (南鳥島)" }
    ];

    const selectSystem = document.getElementById("coordinate-system");
    systems.forEach(sys => {
        let option = document.createElement("option");
        option.value = sys.id;
        option.text = sys.name;
        selectSystem.appendChild(option);
        proj4.defs(`EPSG:${6668 + sys.id}`, `+proj=tmerc +lat_0=${sys.lat} +lon_0=${sys.lon} +k=0.9999 +x_0=0 +y_0=0 +ellps=GRS80 +units=m +no_defs`);
    });

    let isSurveyCoord = true; 

    function updateLabels() {
        const typeLabel = document.getElementById("coord-type-label");
        const labelX = document.getElementById("label-x");
        const labelY = document.getElementById("label-y");
        
        if (isSurveyCoord) {
            typeLabel.innerText = "測量座標系 (X=南北, Y=東西)";
            typeLabel.style.color = "#c0392b";
            labelX.innerText = "2. X座標 [南北] (m)";
            labelY.innerText = "2. Y座標 [東西] (m)";
        } else {
            typeLabel.innerText = "数学座標系 (X=東西, Y=南北)";
            typeLabel.style.color = "#2980b9";
            labelX.innerText = "2. X座標 [東西] (m)";
            labelY.innerText = "2. Y座標 [南北] (m)";
        }
    }

    function toggleXY() {
        isSurveyCoord = !isSurveyCoord;
        updateLabels();
        
        let xInput = document.getElementById("input-x");
        let yInput = document.getElementById("input-y");
        let temp = xInput.value;
        xInput.value = yInput.value;
        yInput.value = temp;
    }
    updateLabels();

    async function calculate() {
        const sysId = parseInt(document.getElementById("coordinate-system").value);
        let valX = parseFloat(document.getElementById("input-x").value);
        let valY = parseFloat(document.getElementById("input-y").value);
        const orthometricHeight = parseFloat(document.getElementById("input-h").value);
        const poleHeight = parseFloat(document.getElementById("pole-height").value);
        const geoidType = document.getElementById("geoid-type").value; 

        if (isNaN(valX) || isNaN(valY) || isNaN(orthometricHeight)) {
            alert("X座標、Y座標、標高をすべて正しく入力してください。");
            return;
        }

        let easting = isSurveyCoord ? valY : valX;
        let northing = isSurveyCoord ? valX : valY;

        const epsgSource = `EPSG:${6668 + sysId}`;
        const epsgDest = "EPSG:4326"; 
        
        const resultLngLat = proj4(epsgSource, epsgDest, [easting, northing]);
        const lon = resultLngLat[0];
        const lat = resultLngLat[1];

        document.getElementById("res-lat").innerText = lat.toFixed(8);
        document.getElementById("res-lon").innerText = lon.toFixed(8);
        document.getElementById("res-geoid").innerText = "計算中...";
        document.getElementById("res-height").innerText = "-";
        document.getElementById("result-box").style.display = "block";

        const apiUrl = `https://vldb.gsi.go.jp/sokuchi/surveycalc/geoid/calcgh/cgi/geoidcalc.pl?outputType=json&datum=2&lat=${lat}&lon=${lon}`;
        
        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error("Network Error");
            const data = await response.json();
            
            if (data.OutputData && data.OutputData.geoidHeight) {
                const geoidHeight = parseFloat(data.OutputData.geoidHeight);
                document.getElementById("res-geoid").innerText = geoidHeight.toFixed(3);
                
                const finalHeight = geoidHeight + orthometricHeight + poleHeight + 0.102;
                document.getElementById("res-height").innerText = finalHeight.toFixed(3);
            } else {
                throw new Error("Geoid Data Not Found");
            }
        } catch (error) {
            console.error(error);
            document.getElementById("res-geoid").innerText = "取得エラー";
            document.getElementById("res-height").innerText = "計算不可";
            alert("国土地理院APIからのジオイド高取得に失敗しました。インターネット接続を確認してください。");
        }
    }
</script>

</body>
</html>
